version: '3.8'

services:
  # LogService - 日志服务
  logservice:
    image: registry.cn-hangzhou.aliyuncs.com/mocloud/matrixone:v2.2.2-fbfa9e4282-2025-10-24
    container_name: mo-logservice
    entrypoint: ["/bin/bash", "-c", "set -euo pipefail; /mo-service -cfg /config/log.toml"]
    volumes:
      - ./config:/config
      - mo-log-data:/var/lib/matrixone/data
    ports:
      - "32000:32000"
      - "32001:32001"
      - "32002:32002"
    networks:
      mo-network:
        aliases:
          - "logservice"
    restart: unless-stopped

  # TN Service - 数据存储节点
  tn:
    image: registry.cn-hangzhou.aliyuncs.com/mocloud/matrixone:v2.2.2-fbfa9e4282-2025-10-24
    container_name: mo-tn
    entrypoint: ["/bin/bash", "-c", "set -euo pipefail; /mo-service -cfg /config/tn.toml"]
    volumes:
      - ./config:/config
      - mo-tn-data:/var/lib/matrixone/data
    depends_on:
      - logservice
    ports:
      - "41010"
    networks:
      mo-network:
        aliases:
          - "tn"
    restart: unless-stopped
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin

  # CN-0 - 计算节点1
  cn-0:
    image: registry.cn-hangzhou.aliyuncs.com/mocloud/matrixone:v2.2.2-fbfa9e4282-2025-10-24
    container_name: mo-cn-0
    entrypoint: ["/bin/bash", "-c", "set -euo pipefail; /mo-service -cfg /config/cn-0.toml"]
    volumes:
      - ./config:/config
      - mo-cn-0-data:/var/lib/matrixone/data
    depends_on:
      - logservice
      - tn
    ports:
      - "6001:6001"
      - "6002"
    networks:
      mo-network:
        aliases:
          - "cn-0"
    restart: unless-stopped
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin

  # CN-1 - 计算节点2
  cn-1:
    image: registry.cn-hangzhou.aliyuncs.com/mocloud/matrixone:v2.2.2-fbfa9e4282-2025-10-24
    container_name: mo-cn-1
    entrypoint: ["/bin/bash", "-c", "set -euo pipefail; /mo-service -cfg /config/cn-1.toml"]
    volumes:
      - ./config:/config
      - mo-cn-1-data:/var/lib/matrixone/data
    depends_on:
      - logservice
      - tn
    ports:
      - "6003:6001"
      - "6002"
    networks:
      mo-network:
        aliases:
          - "cn-1"
    restart: unless-stopped
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin

  # MinIO - 对象存储服务
  minio:
    image: minio/minio:RELEASE.2023-11-01T18-37-25Z
    container_name: mo-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9001' || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      mo-network:
        aliases:
          - "minio"
    restart: unless-stopped

  # 创建MinIO存储桶
  createbuckets:
    image: minio/mc:RELEASE.2023-10-30T18-43-32Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/mo-test || true;
      /usr/bin/mc anonymous set public myminio/mo-test || true;
      echo 'Buckets created successfully';
      "
    networks:
      mo-network:
    restart: "no"

volumes:
  mo-log-data:
  mo-tn-data:
  mo-cn-0-data:
  mo-cn-1-data:
  minio-data:

networks:
  mo-network:
    driver: bridge

